<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" width="720" height="460" font-family="Inter, -apple-system, Segoe UI, sans-serif">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E4EDE6"/><stop offset="1" stop-color="#F7F4EC"/></linearGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6A957B"/><stop offset="1" stop-color="#3D5A4A"/></linearGradient>
    <radialGradient id="hole" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#4A2512"/><stop offset=".55" stop-color="#A25E37"/><stop offset="1" stop-color="#EDBB98"/></radialGradient>
    <marker id="ag" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3D5A4A"/></marker>
    <marker id="at" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#A25E37"/></marker>
  </defs>
  <rect width="720" height="460" rx="20" fill="url(#sky)"/>
  <text x="360" y="40" text-anchor="middle" font-size="21" font-weight="700" fill="#221F1B">Розмова з ШІ: два можливі шляхи</text>
  <text x="360" y="63" text-anchor="middle" font-size="13" fill="#5A5650">за моделлю W. Mansell (Digital Health, 2026) — це ідея, її ще не перевіряли</text>

  <!-- гора -->
  <path d="M340 412 L510 125 L680 412 Z" fill="url(#hill)"/>
  <path d="M482 172 L510 125 L538 172 Q524 164 510 175 Q496 164 482 172Z" fill="#FDFDFB"/>
  <path d="M510 125 V 94" stroke="#221F1B" stroke-width="2"/><path d="M510 94 h24 l-6 6 6 6 h-24z" fill="#E4C77A"/>
  <rect x="548" y="72" width="160" height="58" rx="12" fill="#3D5A4A"/>
  <text x="628" y="96" text-anchor="middle" font-size="14" font-weight="700" fill="#FDFDFB">ВГОРУ</text>
  <text x="628" y="116" text-anchor="middle" font-size="12" fill="#E4EDE6">ширший погляд, план</text>

  <!-- старт -->
  <rect x="20" y="196" width="156" height="78" rx="16" fill="#FDFDFB" stroke="#94897E" stroke-width="1.5"/>
  <rect x="36" y="210" width="62" height="22" rx="11" fill="#E4C77A"/><path d="M48 232l-4 8 10-8" fill="#E4C77A"/>
  <circle cx="56" cy="221" r="2.5" fill="#221F1B"/><circle cx="67" cy="221" r="2.5" fill="#221F1B"/><circle cx="78" cy="221" r="2.5" fill="#221F1B"/>
  <rect x="116" y="206" width="44" height="30" rx="5" fill="#3D5A4A"/><rect x="121" y="211" width="34" height="16" rx="2" fill="#E4EDE6"/><path d="M125 216h20M125 221h13" stroke="#3D5A4A" stroke-width="1.6"/><rect x="132" y="236" width="12" height="4" fill="#3D5A4A"/>
  <text x="98" y="261" text-anchor="middle" font-size="14" font-weight="600" fill="#221F1B">Людина пише боту</text>

  <!-- що вирішує -->
  <rect x="20" y="88" width="196" height="88" rx="14" fill="#FBF3E0" stroke="#E4C77A" stroke-width="1.5"/>
  <text x="34" y="110" font-size="12" font-weight="700" fill="#8A6A2B">ШЛЯХ ЗАЛЕЖИТЬ ВІД:</text>
  <text x="34" y="131" font-size="12.5" fill="#221F1B">• стану людини</text>
  <text x="34" y="149" font-size="12.5" fill="#221F1B">• навіщо вона пише</text>
  <text x="34" y="167" font-size="12.5" fill="#221F1B">• як відповідає бот</text>

  <!-- шлях угору -->
  <path d="M176 222 C 205 200, 222 178, 246 162" fill="none" stroke="#3D5A4A" stroke-width="3" marker-end="url(#ag)"/>
  <rect x="250" y="136" width="178" height="46" rx="12" fill="#FDFDFB" stroke="#3D5A4A" stroke-width="1.5"/>
  <text x="339" y="156" text-anchor="middle" font-size="13" font-weight="600" fill="#3D5A4A">Бот ставить запитання</text>
  <text x="339" y="173" text-anchor="middle" font-size="12" fill="#5A5650">«А що ще може бути?»</text>
  <path d="M428 156 C 455 150, 470 142, 494 134" fill="none" stroke="#3D5A4A" stroke-width="2.5" stroke-dasharray="5 4" marker-end="url(#ag)"/>

  <!-- шлях униз -->
  <path d="M176 254 C 196 274, 204 292, 210 312" fill="none" stroke="#A25E37" stroke-width="3" marker-end="url(#at)"/>
  <rect x="190" y="316" width="216" height="46" rx="12" fill="#FDFDFB" stroke="#A25E37" stroke-width="1.5"/>
  <text x="298" y="336" text-anchor="middle" font-size="13" font-weight="600" fill="#A25E37">Бот лише заспокоює</text>
  <text x="298" y="353" text-anchor="middle" font-size="12" fill="#5A5650">«Не хвилюйтеся, усе буде добре»</text>
  <ellipse cx="248" cy="420" rx="84" ry="24" fill="url(#hole)"/>
  <path d="M248 420 m-58 0 a58 15 0 1 0 116 0 a46 11 0 1 0 -92 0 a34 8 0 1 0 68 0 a22 5 0 1 0 -44 0" fill="none" stroke="#FBEAE0" stroke-width="1.6" opacity=".85"/>
  <path d="M276 362 C 270 378, 262 388, 256 398" fill="none" stroke="#A25E37" stroke-width="2.5" stroke-dasharray="5 4" marker-end="url(#at)"/>
  <rect x="20" y="300" width="156" height="66" rx="12" fill="#A25E37"/>
  <text x="98" y="322" text-anchor="middle" font-size="14" font-weight="700" fill="#FDFDFB">УНИЗ, У «НОРУ»</text>
  <text x="98" y="341" text-anchor="middle" font-size="12" fill="#FBEAE0">ще раз спитати,</text>
  <text x="98" y="357" text-anchor="middle" font-size="12" fill="#FBEAE0">ще раз заспокоїтись</text>
</svg>
