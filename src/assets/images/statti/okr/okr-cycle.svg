<svg width="720" height="460" viewBox="0 0 720 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
  <title id="t">Цикл ОКР за когнітивною моделлю</title>
  <desc id="d">П'ять кроків, з'єднаних стрілками по колу: нав'язлива думка; оцінка думки як небезпечної і такої, за яку людина відповідає; тривога і сумнів; ритуал, перевірка, пошук запевнення або уникнення; коротке полегшення, після якого оцінка лишається неперевіреною, а думка повертається частіше.</desc>
  <rect width="720" height="460" rx="12" fill="#EEF2EF"/>
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#3D5A4A"/>
    </marker>
  </defs>

  <g font-family="Inter, Arial, sans-serif" text-anchor="middle">
    <!-- 1 -->
    <rect x="260" y="20" width="200" height="82" rx="12" fill="#FDFDFB" stroke="#94897E" stroke-width="2"/>
    <text x="360" y="46" font-size="14" font-weight="600" fill="#221F1B">1. Нав'язлива думка</text>
    <text x="360" y="68" font-size="12" fill="#4A443D">думка, образ чи імпульс,</text>
    <text x="360" y="86" font-size="12" fill="#4A443D">які бувають майже в усіх</text>

    <!-- 2 -->
    <rect x="490" y="140" width="200" height="82" rx="12" fill="#FDFDFB" stroke="#C77A4F" stroke-width="2"/>
    <text x="590" y="166" font-size="14" font-weight="600" fill="#221F1B">2. Оцінка думки</text>
    <text x="590" y="188" font-size="12" fill="#4A443D">«Це небезпечно, і я</text>
    <text x="590" y="206" font-size="12" fill="#4A443D">за це відповідаю»</text>

    <!-- 3 -->
    <rect x="420" y="330" width="200" height="82" rx="12" fill="#FDFDFB" stroke="#B5714A" stroke-width="2"/>
    <text x="520" y="356" font-size="14" font-weight="600" fill="#221F1B">3. Тривога і сумнів</text>
    <text x="520" y="378" font-size="12" fill="#4A443D">сильний дискомфорт,</text>
    <text x="520" y="396" font-size="12" fill="#4A443D">відчуття «щось не так»</text>

    <!-- 4 -->
    <rect x="100" y="330" width="200" height="82" rx="12" fill="#FDFDFB" stroke="#3D5A4A" stroke-width="2"/>
    <text x="200" y="356" font-size="14" font-weight="600" fill="#221F1B">4. Ритуал</text>
    <text x="200" y="378" font-size="12" fill="#4A443D">перевірка, миття, запевнення,</text>
    <text x="200" y="396" font-size="12" fill="#4A443D">уникнення, «правильна» думка</text>

    <!-- 5 -->
    <rect x="30" y="140" width="200" height="82" rx="12" fill="#FDFDFB" stroke="#3D5A4A" stroke-width="2"/>
    <text x="130" y="166" font-size="14" font-weight="600" fill="#221F1B">5. Коротке полегшення</text>
    <text x="130" y="188" font-size="12" fill="#4A443D">оцінку не перевірено,</text>
    <text x="130" y="206" font-size="12" fill="#4A443D">думка повертається частіше</text>

    <!-- centre -->
    <text x="360" y="236" font-size="18" font-weight="600" fill="#3D5A4A">Цикл ОКР</text>
    <text x="360" y="258" font-size="12" fill="#5F5850">за когнітивною моделлю</text>
    <text x="360" y="274" font-size="12" fill="#5F5850">(Salkovskis, 1985)</text>
  </g>

  <g fill="none" stroke="#3D5A4A" stroke-width="2" marker-end="url(#ah)">
    <path d="M462,62 Q545,70 572,134"/>
    <path d="M590,226 Q585,290 545,326"/>
    <path d="M416,372 L306,372"/>
    <path d="M176,326 Q140,290 136,228"/>
    <path d="M148,136 Q170,72 254,62"/>
  </g>
</svg>
