<svg width="720" height="400" viewBox="0 0 720 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="720" height="400" fill="#EEF2EF"/>

  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#3D5A4A"/>
    </marker>
  </defs>

  <!-- 4 nodes in a cycle -->
  <g>
    <circle cx="220" cy="100" r="52" fill="#FDFDFB" stroke="#C77A4F" stroke-width="2"/>
    <text x="220" y="96" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#221F1B" text-anchor="middle">Нав'язлива</text>
    <text x="220" y="112" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#221F1B" text-anchor="middle">думка</text>
  </g>

  <g>
    <circle cx="500" cy="100" r="52" fill="#FDFDFB" stroke="#B5714A" stroke-width="2"/>
    <text x="500" y="104" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#221F1B" text-anchor="middle">Тривога</text>
    <text x="500" y="120" font-family="Inter, sans-serif" font-size="11" fill="#5A5650" text-anchor="middle">зростає</text>
  </g>

  <g>
    <circle cx="500" cy="290" r="52" fill="#FDFDFB" stroke="#3D5A4A" stroke-width="2"/>
    <text x="500" y="286" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#221F1B" text-anchor="middle">Компульсія</text>
    <text x="500" y="302" font-family="Inter, sans-serif" font-size="11" fill="#5A5650" text-anchor="middle">(ритуал)</text>
  </g>

  <g>
    <circle cx="220" cy="290" r="52" fill="#FDFDFB" stroke="#94897E" stroke-width="2"/>
    <text x="220" y="286" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#221F1B" text-anchor="middle">Тимчасове</text>
    <text x="220" y="302" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#221F1B" text-anchor="middle">полегшення</text>
  </g>

  <!-- arrows connecting in a cycle -->
  <path d="M272 100 L448 100" fill="none" stroke="#3D5A4A" stroke-width="1.6" marker-end="url(#arrowhead)"/>
  <path d="M500 152 L500 238" fill="none" stroke="#3D5A4A" stroke-width="1.6" marker-end="url(#arrowhead)"/>
  <path d="M448 290 L272 290" fill="none" stroke="#3D5A4A" stroke-width="1.6" marker-end="url(#arrowhead)"/>
  <path d="M220 238 L220 152" fill="none" stroke="#3D5A4A" stroke-width="1.6" marker-end="url(#arrowhead)"/>

  <text x="360" y="365" font-family="Inter, sans-serif" font-size="12" fill="#94897E" text-anchor="middle">Замкнене коло: компульсія дає полегшення зараз, але підтримує розлад у майбутньому</text>
</svg>
