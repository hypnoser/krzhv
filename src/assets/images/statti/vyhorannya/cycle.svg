<svg width="720" height="400" viewBox="0 0 720 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="720" height="400" fill="#EEF2EF"/>

  <defs>
    <marker id="ah4" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#3D5A4A"/>
    </marker>
  </defs>

  <g>
    <rect x="270" y="30" width="180" height="66" rx="10" fill="#FDFDFB" stroke="#C77A4F" stroke-width="2"/>
    <text x="360" y="58" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#221F1B" text-anchor="middle">Перевантаження</text>
    <text x="360" y="76" font-family="Inter, sans-serif" font-size="11" fill="#5A5650" text-anchor="middle">завищені стандарти</text>
  </g>

  <g>
    <rect x="490" y="160" width="190" height="66" rx="10" fill="#FDFDFB" stroke="#B5714A" stroke-width="2"/>
    <text x="585" y="188" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#221F1B" text-anchor="middle">Ігнорування</text>
    <text x="585" y="204" font-family="Inter, sans-serif" font-size="11" fill="#5A5650" text-anchor="middle">сигналів втоми</text>
  </g>

  <g>
    <rect x="270" y="300" width="220" height="66" rx="10" fill="#FDFDFB" stroke="#3D5A4A" stroke-width="2"/>
    <text x="380" y="328" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#221F1B" text-anchor="middle">Виснаження</text>
    <text x="380" y="344" font-family="Inter, sans-serif" font-size="11" fill="#5A5650" text-anchor="middle">цинізм, апатія</text>
  </g>

  <g>
    <rect x="40" y="160" width="190" height="66" rx="10" fill="#FDFDFB" stroke="#94897E" stroke-width="2"/>
    <text x="135" y="188" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#221F1B" text-anchor="middle">Коротка пауза</text>
    <text x="135" y="204" font-family="Inter, sans-serif" font-size="11" fill="#5A5650" text-anchor="middle">без зміни переконань</text>
  </g>

  <path d="M450 70 Q520 90 545 155" fill="none" stroke="#3D5A4A" stroke-width="1.6" marker-end="url(#ah4)"/>
  <path d="M560 226 Q520 280 460 310" fill="none" stroke="#3D5A4A" stroke-width="1.6" marker-end="url(#ah4)"/>
  <path d="M270 330 Q200 310 165 232" fill="none" stroke="#3D5A4A" stroke-width="1.6" marker-end="url(#ah4)"/>
  <path d="M160 160 Q200 90 268 62" fill="none" stroke="#3D5A4A" stroke-width="1.6" marker-end="url(#ah4)"/>

  <text x="360" y="395" font-family="Inter, sans-serif" font-size="12" fill="#94897E" text-anchor="middle">Пауза знижує навантаження тимчасово, але не змінює переконання, які підтримують цикл</text>
