<svg viewBox="0 0 720 460" xmlns="http://www.w3.org/2000/svg" font-family="Inter, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="720" height="460" rx="16" fill="#EEF2EF"/>

  <text x="360" y="38" text-anchor="middle" font-size="18" font-weight="600" fill="#3D5A4A">Як невизначеність переростає в тривогу</text>

  <!-- Step 1 -->
  <g>
    <rect x="20" y="180" width="150" height="90" rx="14" fill="#FDFDFB" stroke="#3D5A4A" stroke-width="2"/>
    <text x="95" y="215" text-anchor="middle" font-size="13" font-weight="600" fill="#3D5A4A">Невизначена</text>
    <text x="95" y="233" text-anchor="middle" font-size="13" font-weight="600" fill="#3D5A4A">ситуація</text>
    <text x="95" y="255" text-anchor="middle" font-size="11" fill="#94897E">(майбутнє неясне)</text>
  </g>

  <!-- Arrow 1 -->
  <path d="M 175 225 L 205 225" stroke="#3D5A4A" stroke-width="2.5" marker-end="url(#arrow2)"/>

  <!-- Step 2 -->
  <g>
    <rect x="210" y="180" width="150" height="90" rx="14" fill="#FDFDFB" stroke="#C77A4F" stroke-width="2"/>
    <text x="285" y="208" text-anchor="middle" font-size="13" font-weight="600" fill="#C77A4F">Сприйняття</text>
    <text x="285" y="226" text-anchor="middle" font-size="13" font-weight="600" fill="#C77A4F">невизначеності</text>
    <text x="285" y="244" text-anchor="middle" font-size="13" font-weight="600" fill="#C77A4F">як загрози</text>
  </g>

  <!-- Arrow 2 -->
  <path d="M 365 225 L 395 225" stroke="#3D5A4A" stroke-width="2.5" marker-end="url(#arrow2)"/>

  <!-- Step 3 -->
  <g>
    <rect x="400" y="180" width="150" height="90" rx="14" fill="#FDFDFB" stroke="#B5714A" stroke-width="2"/>
    <text x="475" y="208" text-anchor="middle" font-size="13" font-weight="600" fill="#B5714A">Тривожне</text>
    <text x="475" y="226" text-anchor="middle" font-size="13" font-weight="600" fill="#B5714A">прокручування</text>
    <text x="475" y="244" text-anchor="middle" font-size="13" font-weight="600" fill="#B5714A">думок (worry)</text>
  </g>

  <!-- Arrow 3 -->
  <path d="M 555 225 L 585 225" stroke="#3D5A4A" stroke-width="2.5" marker-end="url(#arrow2)"/>

  <!-- Step 4 -->
  <g>
    <rect x="590" y="180" width="110" height="90" rx="14" fill="#FDFDFB" stroke="#94897E" stroke-width="2"/>
    <text x="645" y="208" text-anchor="middle" font-size="13" font-weight="600" fill="#94897E">Уникнення</text>
    <text x="645" y="226" text-anchor="middle" font-size="13" font-weight="600" fill="#94897E">/ пошук</text>
    <text x="645" y="244" text-anchor="middle" font-size="13" font-weight="600" fill="#94897E">гарантій</text>
  </g>

  <!-- Feedback loop arrow (back to step 2, reinforcing) -->
  <path d="M 645 272 C 645 340 285 340 285 272" fill="none" stroke="#94897E" stroke-width="2" stroke-dasharray="6,5" marker-end="url(#arrow3)"/>
  <text x="465" y="365" text-anchor="middle" font-size="12" fill="#94897E">короткострокове полегшення підсилює тривогу в довгу</text>

  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#3D5A4A"/>
    </marker>
    <marker id="arrow3" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#94897E"/>
    </marker>
  </defs>

  <text x="360" y="430" text-anchor="middle" font-size="12" fill="#94897E">Модель непереносимості невизначеності (Dugas, Freeston et al.) — механізм, спільний для різних видів тривоги</text>
</svg>
