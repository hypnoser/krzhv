<svg viewBox="0 0 720 440" xmlns="http://www.w3.org/2000/svg" font-family="Inter, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="720" height="440" rx="16" fill="#EEF2EF"/>

  <text x="360" y="38" text-anchor="middle" font-size="18" font-weight="600" fill="#3D5A4A">Прокрастинація як «ремонт настрою»</text>

  <!-- Node 1: Top -->
  <g>
    <rect x="270" y="65" width="180" height="75" rx="14" fill="#FDFDFB" stroke="#3D5A4A" stroke-width="2"/>
    <text x="360" y="95" text-anchor="middle" font-size="13" font-weight="600" fill="#3D5A4A">Неприємне завдання</text>
    <text x="360" y="115" text-anchor="middle" font-size="13" font-weight="600" fill="#3D5A4A">викликає негативні</text>
    <text x="360" y="132" text-anchor="middle" font-size="12" fill="#3D5A4A">емоції (тривога, нудьга)</text>
  </g>

  <!-- Node 2: Right -->
  <g>
    <rect x="470" y="185" width="190" height="75" rx="14" fill="#FDFDFB" stroke="#C77A4F" stroke-width="2"/>
    <text x="565" y="215" text-anchor="middle" font-size="13" font-weight="600" fill="#C77A4F">Відкладання завдання —</text>
    <text x="565" y="233" text-anchor="middle" font-size="13" font-weight="600" fill="#C77A4F">швидкий спосіб зняти</text>
    <text x="565" y="251" text-anchor="middle" font-size="12" fill="#C77A4F">неприємне відчуття</text>
  </g>

  <!-- Node 3: Bottom -->
  <g>
    <rect x="270" y="305" width="180" height="75" rx="14" fill="#FDFDFB" stroke="#B5714A" stroke-width="2"/>
    <text x="360" y="335" text-anchor="middle" font-size="13" font-weight="600" fill="#B5714A">Короткострокове</text>
    <text x="360" y="353" text-anchor="middle" font-size="13" font-weight="600" fill="#B5714A">полегшення настрою</text>
    <text x="360" y="371" text-anchor="middle" font-size="12" fill="#B5714A">(тимчасове)</text>
  </g>

  <!-- Node 4: Left -->
  <g>
    <rect x="60" y="185" width="190" height="75" rx="14" fill="#FDFDFB" stroke="#94897E" stroke-width="2"/>
    <text x="155" y="215" text-anchor="middle" font-size="13" font-weight="600" fill="#94897E">Провина, стрес ближче</text>
    <text x="155" y="233" text-anchor="middle" font-size="13" font-weight="600" fill="#94897E">до дедлайну — задача</text>
    <text x="155" y="251" text-anchor="middle" font-size="12" fill="#94897E">стає ще неприємнішою</text>
  </g>

  <defs>
    <marker id="arrow4" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#3D5A4A"/>
    </marker>
  </defs>

  <path d="M 452 125 Q 550 150 545 183" fill="none" stroke="#3D5A4A" stroke-width="2.5" marker-end="url(#arrow4)"/>
  <path d="M 555 262 Q 500 320 452 335" fill="none" stroke="#3D5A4A" stroke-width="2.5" marker-end="url(#arrow4)"/>
  <path d="M 268 335 Q 190 320 165 262" fill="none" stroke="#3D5A4A" stroke-width="2.5" marker-end="url(#arrow4)"/>
  <path d="M 175 183 Q 220 150 268 128" fill="none" stroke="#3D5A4A" stroke-width="2.5" marker-end="url(#arrow4)"/>

  <text x="360" y="418" text-anchor="middle" font-size="12" fill="#94897E">Пріоритет короткострокового полегшення над довгостроковою метою (Sirois &amp; Pychyl, 2013)</text>
</svg>
