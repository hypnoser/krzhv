<svg width="720" height="420" viewBox="0 0 720 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
  <title id="t">Панічне коло: від тілесного відчуття до страху</title>
  <desc id="d">Чотири кроки, з'єднані стрілками по колу: тілесне відчуття, наприклад серцебиття чи нестача повітря; катастрофічне тлумачення «зі мною щось дуже погане»; страх і напруження тіла; посилення відчуттів, уникання та перевірки, після чого коло замикається. КПТ працює з другим кроком (думки) і з четвертим (уникання й перевірки).</desc>
  <rect width="720" height="420" rx="12" fill="#EEF2EF"/>
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#3D5A4A"/>
    </marker>
  </defs>

  <g font-family="Inter, Arial, sans-serif" text-anchor="middle">
    <rect x="40" y="30" width="270" height="90" rx="12" fill="#FDFDFB" stroke="#94897E" stroke-width="2"/>
    <text x="175" y="58" font-size="14" font-weight="600" fill="#221F1B">1. Тілесне відчуття</text>
    <text x="175" y="80" font-size="12" fill="#5F5850">серцебиття, нестача повітря,</text>
    <text x="175" y="98" font-size="12" fill="#5F5850">запаморочення, поколювання</text>

    <rect x="410" y="30" width="270" height="90" rx="12" fill="#FDFDFB" stroke="#C77A4F" stroke-width="2"/>
    <text x="545" y="58" font-size="14" font-weight="600" fill="#221F1B">2. Катастрофічна думка</text>
    <text x="545" y="80" font-size="12" fill="#5F5850">«це серце», «я задихнусь»,</text>
    <text x="545" y="98" font-size="12" fill="#5F5850">«я втрачу контроль»</text>

    <rect x="410" y="270" width="270" height="100" rx="12" fill="#FDFDFB" stroke="#B5714A" stroke-width="2"/>
    <text x="545" y="298" font-size="14" font-weight="600" fill="#221F1B">3. Страх і напруження</text>
    <text x="545" y="320" font-size="12" fill="#5F5850">тривога зростає, тіло напружується,</text>
    <text x="545" y="338" font-size="12" fill="#5F5850">дихання може частішати</text>

    <rect x="40" y="270" width="270" height="100" rx="12" fill="#FDFDFB" stroke="#3D5A4A" stroke-width="2"/>
    <text x="175" y="298" font-size="14" font-weight="600" fill="#221F1B">4. Відчуттів більше</text>
    <text x="175" y="320" font-size="12" fill="#5F5850">постійні перевірки пульсу й тиску,</text>
    <text x="175" y="338" font-size="12" fill="#5F5850">уникання ситуацій</text>

    <text x="360" y="186" font-size="17" font-weight="600" fill="#3D5A4A">Панічне коло</text>
    <text x="360" y="208" font-size="12" fill="#5F5850">спрощена схема</text>
    <text x="360" y="224" font-size="12" fill="#5F5850">когнітивної моделі</text>

    <text x="530" y="150" text-anchor="end" font-size="11" font-weight="600" fill="#C77A4F">КПТ: робота з думками</text>
    <text x="190" y="150" text-anchor="start" font-size="11" font-weight="600" fill="#3D5A4A">КПТ: менше уникання й перевірок</text>
  </g>

  <g fill="none" stroke="#3D5A4A" stroke-width="2" marker-end="url(#ah)">
    <path d="M312,75 L406,75"/>
    <path d="M545,124 L545,266"/>
    <path d="M406,320 L314,320"/>
    <path d="M175,266 L175,124"/>
  </g>
</svg>
