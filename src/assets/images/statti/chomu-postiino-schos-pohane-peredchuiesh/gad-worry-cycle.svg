<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="100%" height="100%" style="background:#0f172a; border-radius:12px; font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;">
  <defs>
    <!-- Маркер стрілки -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#94a3b8" />
    </marker>
    <!-- Світіння для центрального блоку -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#38bdf8" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Заголовок схеми -->
  <text x="360" y="28" fill="#94a3b8" font-size="11" font-weight="700" letter-spacing="1.2" text-anchor="middle">НЕЙРОКОГНІТИВНИЙ МЕХАНІЗМ ПІДТРИМАННЯ ТРИВОГИ</text>

  <!-- Траєкторії циклу (стрілки) -->
  <!-- 1 -> 2 -->
  <path d="M 490 80 C 560 80, 585 105, 585 140" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <!-- 2 -> 3 -->
  <path d="M 585 225 C 585 260, 560 290, 495 290" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <!-- 3 -> 4 -->
  <path d="M 225 290 C 160 290, 135 260, 135 225" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <!-- 4 -> 1 -->
  <path d="M 135 140 C 135 105, 160 80, 220 80" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>

  <!-- БЛОК 1: Тригер і думка (Вгорі) -->
  <g transform="translate(210, 42)">
    <rect width="300" height="74" rx="10" fill="#1e293b" stroke="#f43f5e" stroke-width="1.5"/>
    <text x="16" y="24" fill="#fb7185" font-size="11" font-weight="700" letter-spacing="0.5">1. ТРИГЕР І КАТАСТРОФІЗАЦІЯ</text>
    <text x="16" y="44" fill="#f8fafc" font-size="13" font-weight="600">Невизначеність або стресор</text>
    <text x="16" y="61" fill="#cbd5e1" font-size="11">Автоматична думка: «А що, як станеться лихо?»</text>
  </g>

  <!-- БЛОК 2: Тіло / Симпатика (Праворуч) -->
  <g transform="translate(470, 145)">
    <rect width="230" height="78" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="16" y="24" fill="#fbbf24" font-size="11" font-weight="700" letter-spacing="0.5">2. ТІЛЕСНЕ ЗБУДЖЕННЯ</text>
    <text x="16" y="44" fill="#f8fafc" font-size="13" font-weight="600">Активація симпатики</text>
    <text x="16" y="61" fill="#cbd5e1" font-size="11">М'язовий затиск, спазм, прискорений пульс</text>
  </g>

  <!-- БЛОК 3: Помилкова інтерпретація (Внизу) -->
  <g transform="translate(210, 252)">
    <rect width="300" height="74" rx="10" fill="#1e293b" stroke="#a855f7" stroke-width="1.5"/>
    <text x="16" y="24" fill="#c084fc" font-size="11" font-weight="700" letter-spacing="0.5">3. ХИБНА ІНТЕРПРЕТАЦІЯ МОЗКУ</text>
    <text x="16" y="44" fill="#f8fafc" font-size="13" font-weight="600">«Тіло напружене — загроза реальна»</text>
    <text x="16" y="61" fill="#cbd5e1" font-size="11">Мозок сприймає власне збудження як факт біди</text>
  </g>

  <!-- БЛОК 4: Охоронна поведінка (Ліворуч) -->
  <g transform="translate(20, 145)">
    <rect width="230" height="78" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="16" y="24" fill="#38bdf8" font-size="11" font-weight="700" letter-spacing="0.5">4. ПАСТКА НАДКОНТРОЛЮ</text>
    <text x="16" y="44" fill="#f8fafc" font-size="13" font-weight="600">Охоронна поведінка</text>
    <text x="16" y="61" fill="#cbd5e1" font-size="11">Гугління, сканування тіла, пошук запевнень</text>
  </g>

  <!-- ЦЕНТРАЛЬНИЙ БЛОК: Ядро розладу -->
  <g transform="translate(260, 145)" filter="url(#glow)">
    <rect width="200" height="78" rx="14" fill="#020617" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.6"/>
    <text x="100" y="28" fill="#e2e8f0" font-size="11" font-weight="800" letter-spacing="1.2" text-anchor="middle">ЗАМКНЕНЕ КОЛО</text>
    <text x="100" y="46" fill="#38bdf8" font-size="12" font-weight="700" text-anchor="middle">ФОНОВОЇ ТРИВОГИ</text>
    <text x="100" y="64" fill="#94a3b8" font-size="10" text-anchor="middle">Хибне підкріплення розладу</text>
  </g>

  <!-- Підвал схеми -->
  <text x="360" y="380" fill="#64748b" font-size="11" text-anchor="middle">Когнітивно-поведінкова модель генералізованого тривожного розладу (CBT Model of GAD)</text>
</svg>
