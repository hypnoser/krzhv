<svg viewBox="0 0 720 420" xmlns="http://www.w3.org/2000/svg" font-family="Inter, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="720" height="420" rx="16" fill="#EEF2EF"/>

  <!-- Title -->
  <text x="360" y="40" text-anchor="middle" font-size="18" font-weight="600" fill="#3D5A4A">Цикл гіперактивації при безсонні</text>

  <!-- Node 1: Top -->
  <g>
    <rect x="270" y="65" width="180" height="70" rx="14" fill="#FDFDFB" stroke="#3D5A4A" stroke-width="2"/>
    <text x="360" y="93" text-anchor="middle" font-size="14" font-weight="600" fill="#3D5A4A">Стрес і тривожні</text>
    <text x="360" y="112" text-anchor="middle" font-size="14" font-weight="600" fill="#3D5A4A">думки перед сном</text>
  </g>

  <!-- Node 2: Right -->
  <g>
    <rect x="470" y="175" width="180" height="70" rx="14" fill="#FDFDFB" stroke="#C77A4F" stroke-width="2"/>
    <text x="560" y="203" text-anchor="middle" font-size="14" font-weight="600" fill="#C77A4F">Фізіологічне</text>
    <text x="560" y="222" text-anchor="middle" font-size="14" font-weight="600" fill="#C77A4F">збудження (гіперактивація)</text>
  </g>

  <!-- Node 3: Bottom -->
  <g>
    <rect x="270" y="285" width="180" height="70" rx="14" fill="#FDFDFB" stroke="#B5714A" stroke-width="2"/>
    <text x="360" y="313" text-anchor="middle" font-size="14" font-weight="600" fill="#B5714A">Неможливість</text>
    <text x="360" y="332" text-anchor="middle" font-size="14" font-weight="600" fill="#B5714A">заснути</text>
  </g>

  <!-- Node 4: Left -->
  <g>
    <rect x="70" y="175" width="180" height="70" rx="14" fill="#FDFDFB" stroke="#94897E" stroke-width="2"/>
    <text x="160" y="203" text-anchor="middle" font-size="14" font-weight="600" fill="#94897E">Тривога через сам</text>
    <text x="160" y="222" text-anchor="middle" font-size="14" font-weight="600" fill="#94897E">факт безсоння</text>
  </g>

  <!-- Arrows (curved, forming a cycle) -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#3D5A4A"/>
    </marker>
  </defs>

  <!-- top -> right -->
  <path d="M 452 120 Q 540 140 520 178" fill="none" stroke="#3D5A4A" stroke-width="2.5" marker-end="url(#arrow)"/>
  <!-- right -> bottom -->
  <path d="M 552 248 Q 520 300 452 315" fill="none" stroke="#3D5A4A" stroke-width="2.5" marker-end="url(#arrow)"/>
  <!-- bottom -> left -->
  <path d="M 268 315 Q 200 300 168 248" fill="none" stroke="#3D5A4A" stroke-width="2.5" marker-end="url(#arrow)"/>
  <!-- left -> top -->
  <path d="M 200 178 Q 220 140 268 122" fill="none" stroke="#3D5A4A" stroke-width="2.5" marker-end="url(#arrow)"/>

  <text x="360" y="400" text-anchor="middle" font-size="12" fill="#94897E">Кожен елемент циклу підсилює наступний — КПТ-Б розриває коло в кількох точках одночасно</text>
</svg>
