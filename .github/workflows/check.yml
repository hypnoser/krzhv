name: Check site

# Перевірка перед злиттям: збірка і внутрішні посилання. Нічого не публікує.
on:
  pull_request:
  push:
    branches-ignore: ["main"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npx @11ty/eleventy --config=eleventy.config.js
      - run: npm test
