name: Build and deploy site

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  # Щогодини перезбираємо сайт, щоб оновити знімок статистики для /secret/analytics/
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Build site with Eleventy
        run: npx @11ty/eleventy --config=eleventy.config.js

      # Знімок Cloudflare Web Analytics → зашифрований _site/secret/analytics/data.json.
      # Без секретів CF_ANALYTICS_TOKEN, CF_ACCOUNT_ID, SECRET_PASSWORD крок лише попереджає й нічого не ламає.
      - name: Fetch analytics snapshot
        continue-on-error: true
        env:
          CF_ANALYTICS_TOKEN: ${{ secrets.CF_ANALYTICS_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          SECRET_PASSWORD: ${{ secrets.SECRET_PASSWORD }}
        run: node scripts/fetch-analytics.js

      - name: Check internal links
        run: npm test

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./_site"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Очищення кешу Cloudflare після публікації. Працює, лише якщо в репозиторії задано секрети
  # CLOUDFLARE_API_TOKEN (права: Zone → Cache Purge) і CLOUDFLARE_ZONE_ID. Без них крок пропускається:
  # сторінки й так оновлюються на Cloudflare протягом 10 хвилин, зображення — протягом доби.
  purge-cache:
    needs: deploy
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ZONE: ${{ secrets.CLOUDFLARE_ZONE_ID }}
    steps:
      - name: Purge Cloudflare cache
        if: ${{ env.CF_TOKEN != '' && env.CF_ZONE != '' }}
        continue-on-error: true
        run: |
          curl -fsS -X POST "https://api.cloudflare.com/client/v4/zones/$CF_ZONE/purge_cache" \
            -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" \
            --data '{"purge_everything":true}'
